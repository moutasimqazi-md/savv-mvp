# Apache websocket proxy for the shared websockify broker, for cPanel/WHM
# deployments (stock cPanel uses Apache + EasyApache 4, not Nginx).
#
# Prerequisite: enable mod_proxy, mod_proxy_wstunnel, and mod_proxy_http in
# WHM -> EasyApache 4 -> Customize -> Apache Modules.
#
# Add this block via WHM -> Apache Configuration -> Include Editor ->
# "Pre VirtualHost Include" (All Versions) scoped to your domain, or paste
# it into the domain's vhost via WHM's "Additional Domain" advanced config
# if your WHM version exposes that. Replace your-domain accordingly.
#
# This does the same job as docs/samples/nginx-savv.conf's /rbi/ block: it
# proxies ONLY the shared, long-lived websockify broker on 127.0.0.1:6900 -
# the runner's internal API (port 3010) and per-session VNC ports must never
# appear here or anywhere else reachable from outside 127.0.0.1.

<Location /rbi/>
    ProxyPreserveHost On
    ProxyPass         ws://127.0.0.1:6900/ upgrade=websocket timeout=3600
    ProxyPassReverse  ws://127.0.0.1:6900/
</Location>
