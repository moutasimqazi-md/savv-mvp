; Sample Supervisor config for the Laravel database queue worker.
; Replace REPLACE_WITH_APP_PATH and REPLACE_WITH_APP_USER with real values.
; Copy to /etc/supervisor/conf.d/supervisor-savv-queue.conf

[program:savv-queue]
process_name=%(program_name)s_%(process_num)02d
command=php REPLACE_WITH_APP_PATH/backend/artisan queue:work database --queue=imports,default --sleep=3 --tries=3 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=REPLACE_WITH_APP_USER
numprocs=2
redirect_stderr=true
stdout_logfile=REPLACE_WITH_APP_PATH/backend/storage/logs/queue-worker.log
stopwaitsecs=130
