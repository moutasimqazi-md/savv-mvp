; Sample Supervisor config for the Node.js Playwright runner.
; Replace REPLACE_WITH_APP_PATH and REPLACE_WITH_APP_USER with real values.
; Copy to /etc/supervisor/conf.d/supervisor-savv-runner.conf

[program:savv-runner]
command=node REPLACE_WITH_APP_PATH/runner/src/server.js
directory=REPLACE_WITH_APP_PATH/runner
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=REPLACE_WITH_APP_USER
redirect_stderr=true
stdout_logfile=REPLACE_WITH_APP_PATH/runner/runner.log
environment=NODE_ENV="production"
