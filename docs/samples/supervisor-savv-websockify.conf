; Sample Supervisor config for the SHARED, long-lived websockify broker.
; This is the only websocket process Nginx ever proxies to - it multiplexes
; every concurrent import session using its TokenFile plugin, which reads
; "token -> 127.0.0.1:<vncPort>" mapping files that the runner writes/removes
; per session (see runner/src/display/streamingStack.js). It listens on
; 127.0.0.1 only.
;
; Replace REPLACE_WITH_APP_PATH and REPLACE_WITH_APP_USER with real values.
; Copy to /etc/supervisor/conf.d/supervisor-savv-websockify.conf

[program:savv-websockify]
command=websockify --token-plugin=TokenFile --token-source=REPLACE_WITH_APP_PATH/runner/tmp/vnc-tokens --web=/usr/share/novnc 127.0.0.1:6900
directory=REPLACE_WITH_APP_PATH/runner
autostart=true
autorestart=true
user=REPLACE_WITH_APP_USER
redirect_stderr=true
stdout_logfile=REPLACE_WITH_APP_PATH/runner/websockify.log
