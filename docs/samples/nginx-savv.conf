# Sample Nginx server block for the Ubuntu demonstration deployment.
# Replace your-domain, REPLACE_WITH_APP_PATH, and the PHP-FPM socket path
# with real values. Assumes certbot has already issued a certificate
# (see docs/deployment-ubuntu.md step 9).

server {
    listen 80;
    server_name your-domain;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain;

    ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;

    root REPLACE_WITH_APP_PATH/backend/public;
    index index.php;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # The single shared websockify broker (see
    # docs/samples/supervisor-savv-websockify.conf). It multiplexes every
    # concurrent import session by the ?token= query parameter - Nginx
    # itself never needs to know which session maps to which backend port.
    location /rbi/ {
        proxy_pass http://127.0.0.1:6900/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The runner's internal API (127.0.0.1:3010) is deliberately NOT proxied
    # here or anywhere else in this server block - it is only ever called
    # server-to-server by PHP-FPM on the same machine.

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
