<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: amazon.in real order-card structure (invented data)</title></head>

<!--
  This fixture mirrors the real amazon.in "Your Orders" DOM structure
  (order-card / yohtmlc-order-id / order-header__header-list-item /
  yohtmlc-product-title / item-box / yohtmlc-shipment-status-primaryText),
  confirmed against a sanitized real page - see docs/parser-maintenance.md.
  Every value below is invented: fake order number, fake product, fake
  price, fake date. It also includes a "Ship to" recipient row, exactly
  like the real page does, specifically to prove the parser never reads it.
-->
<div class="order-card js-order-card">
  <div class="a-box a-color-offset-background order-header">
    <ul>
      <li class="order-header__header-list-item" role="presentation">
        <div class="a-row a-size-mini"><span class="a-color-secondary a-text-caps">Order placed</span></div>
        <div class="a-row"><span class="a-size-base a-color-secondary aok-break-word">3 January 2026</span></div>
      </li>
      <li class="order-header__header-list-item" role="presentation">
        <div class="a-row a-size-mini"><span class="a-color-secondary a-text-caps">Total</span></div>
        <div class="a-row"><span class="a-size-base a-color-secondary aok-break-word">₹2,499.00</span></div>
      </li>
      <li class="order-header__header-list-item" role="presentation">
        <div class="yohtmlc-recipient">
          <div class="a-row a-size-mini"><span class="a-color-secondary a-text-caps">Ship to</span></div>
          <div class="a-row a-size-base">
            <a class="a-link-normal" href="#">Synthetic Test Recipient, 42 Invented Lane, Faketown 000000</a>
          </div>
        </div>
      </li>
      <li class="order-header__header-list-item" role="presentation">
        <div class="yohtmlc-order-id">
          <span class="a-color-secondary a-text-caps">Order #</span>
          <span class="a-color-secondary" dir="ltr">999-1112223-3334445</span>
        </div>
      </li>
      <li class="order-header__header-list-item yohtmlc-order-level-connections" role="presentation">
        <a class="a-link-normal" href="https://www.amazon.in/your-orders/order-details?orderID=999-1112223-3334445&amp;ref=ppx_yo2ov_dt_b_fed_order_details">View order details</a>
        <a class="a-link-normal" href="https://www.amazon.in/your-orders/invoice/popover?orderId=999-1112223-3334445&amp;ref_=fed_invoice_ajax">Invoice</a>
      </li>
    </ul>
  </div>

  <div class="a-box delivery-box"><div class="a-box-inner">
    <div class="yohtmlc-shipment-status-primaryText"><h3>Delivered 6 January 2026</h3></div>
    <div class="yohtmlc-shipment-status-secondaryText">Package was handed to resident</div>
  </div></div>

  <div class="a-fixed-left-grid item-box a-spacing-none"><div class="a-fixed-left-grid-inner" style="padding-left:100px">
    <div class="product-image">
      <a class="a-link-normal" tabindex="-1" href="https://www.amazon.in/dp/SYNTHREAL001?ref=ppx_yo2ov_dt_b_fed_asin_title">
        <img alt="Synthetic Desk Organizer" src="synthetic-organizer.jpg" data-a-hires="https://m.media-amazon.com/images/I/synthetic-organizer-hires.jpg">
      </a>
    </div>
    <div class="a-fixed-left-grid-col a-col-right" style="padding-left:0%;float:left;">
      <div class="a-row">
        <div class="yohtmlc-product-title">
          <a aria-hidden="false" class="a-link-normal" href="https://www.amazon.in/dp/SYNTHREAL001?ref=ppx_yo2ov_dt_b_fed_asin_title">
            Synthetic Desk Organizer
          </a>
        </div>
      </div>
    </div>
  </div></div>
